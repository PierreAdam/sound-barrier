# Local development services for Sound-Barrier (./dev.sh starts them): the Postgres
# database of the backend. Credentials below are for local development only.
# To run Sound-Barrier on a server, see docker-compose.yml (next to this file).

# Fixed project name: containers and volumes do not depend on the folder name.
name: sound-barrier

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: soundbarrier
      POSTGRES_PASSWORD: soundbarrier
      POSTGRES_DB: soundbarrier
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U soundbarrier -d soundbarrier"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
