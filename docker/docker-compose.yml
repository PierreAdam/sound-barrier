# Sound-Barrier on a server: the application (pre-built image from Docker Hub) and its
# Postgres database. Put this file and .env (from .env.example) in a folder, then:
#   docker compose up -d
# Web UI and Subsonic clients: http://<server>:4040 (first login admin / admin).
# Update: docker compose pull && docker compose up -d
# From the sources instead: uncomment `build`, then docker compose up -d --build.

name: sound-barrier

services:
  sound-barrier:
    image: dontpanic57/sound-barrier:${SOUND_BARRIER_VERSION:-latest}
    # build: ..   # the repository root, when this file is in its docker/ folder
    restart: unless-stopped
    # Owner (uid:gid) of the music files: imports write into the library as this user.
    user: "${PUID:-1000}:${PGID:-1000}"
    ports:
      - "${PORT:-4040}:4040"
    environment:
      TZ: ${TZ:-UTC} # scan schedule times are in this time zone
      SOUND_BARRIER_DATABASE_URL: postgresql+asyncpg://soundbarrier:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/soundbarrier
      # Behind a reverse proxy (HTTPS): trust its X-Forwarded-* headers.
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1}
    volumes:
      - ${MUSIC_DIR:?set MUSIC_DIR in .env}:/music
      # Optional: podcasts and audiobooks, kept apart from the music (turn them on in
      # Settings → Library). Unset: empty folders next to this file.
      - ${PODCASTS_DIR:-./podcasts}:/podcasts
      - ${AUDIOBOOKS_DIR:-./audiobooks}:/audiobooks
      # Where new music arrives (e.g. your downloads). Read-only is enough in the default
      # "copy" import mode; the "move" mode needs read-write.
      - ${IMPORT_DIR:-./import}:/import:ro
      - ${BEETS_DIR:-./beets}:/beets
      - ${DATA_DIR:-./data}:/data
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: soundbarrier
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: soundbarrier
    volumes:
      - ${POSTGRES_DIR:-./postgres}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U soundbarrier -d soundbarrier"]
      interval: 5s
      timeout: 3s
      retries: 10
