[project]
name = "sb-transcriber"
version = "1.0.0"
description = "Companion app of Sound-Barrier: speech to text of podcasts and audiobooks on a GPU"
requires-python = ">=3.11,<3.14"
dependencies = [
    "faster-whisper>=1.1.1,<2",  # CTranslate2 >= 4.5: CUDA 12 and cuDNN 9
    "httpx>=0.27",
]

[project.optional-dependencies]
# NVIDIA's libraries from pip: no system-wide CUDA install needed (only the GPU driver).
cuda = [
    "nvidia-cublas-cu12>=12.4,<13",
    "nvidia-cudnn-cu12>=9.1,<10",
]
dev = ["pytest>=8"]

[project.scripts]
transcriber = "sb_transcriber.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sb_transcriber"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["sb_transcriber"]
