# Local development services for Sound-Barrier.
# Credentials below are for local development only.

# Fixed project name: containers and volumes do not depend on the folder name.
name: sound-barrier

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: soundbarrier
      POSTGRES_PASSWORD: soundbarrier
      POSTGRES_DB: soundbarrier
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U soundbarrier -d soundbarrier"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Reference server, used to compare API responses on the same library.
  # Start it with: docker compose --profile reference up navidrome
  navidrome:
    image: deluan/navidrome:latest
    profiles: ["reference"]
    ports:
      - "4533:4533"
    environment:
      ND_LOGLEVEL: info
    volumes:
      - navidrome-data:/data
      - ${MUSIC_DIR:-./music}:/music:ro

volumes:
  postgres-data:
  navidrome-data:
