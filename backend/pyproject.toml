[project]
name = "sound-barrier"
version = "0.1.0"
description = "Self-hosted music server implementing the Subsonic API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-multipart>=0.0.9",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "cryptography>=42",
    "mutagen>=1.47",
    "pillow>=10.3",
    "tzdata>=2024.1", # time zones for the scan schedule (Windows has no system tz database)
    "beets[fetchart,embedart]>=2.14", # MusicBrainz matching on import (used as a library)
    "httpx>=0.27", # external services (Last.fm, Deezer)
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "testcontainers[postgres]>=4.7",
    "ruff>=0.5",
    "pyright>=1.1.370",
]

[project.scripts]
sound-barrier = "app.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.format]
line-ending = "lf"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Tests use blocking file operations to build fixture libraries.
"tests/**" = ["ASYNC240"]

[tool.ruff.lint.isort]
# The local `alembic/` migrations directory would otherwise look first-party.
known-third-party = ["alembic"]

[tool.pyright]
include = ["app"]
venvPath = "."
venv = ".venv"
typeCheckingMode = "strict"
pythonVersion = "3.12"
reportMissingTypeStubs = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = ["integration: needs Docker (Postgres via Testcontainers)"]
